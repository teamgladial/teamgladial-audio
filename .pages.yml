media:
  - name: music_art
    label: Music artwork
    input: public/images/releases
    output: /images/releases
    extensions: [png, jpg, jpeg, webp, gif]
    rename: safe
  - name: music_audio
    label: Audio files
    input: public/audio
    output: /audio
    extensions: [mp3, wav, ogg, m4a, flac]
    rename: safe
content:
  - name: releases
    label: Music and releases
    type: collection
    path: src/content/releases
    filename: "{fields.slug}.md"
    view:
      primary: title
      fields: [title, category, date, draft]
      sort: [date, title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: date
        label: Release date
        type: date
      - name: category
        label: Category
        type: string
      - name: description
        label: Description
        type: text
      - name: coverImage
        label: Artwork
        type: image
        options:
          media: music_art
          path: public/images/releases
          rename: safe
      - name: imageAlt
        label: Artwork description
        type: string
      - name: audio
        label: Audio file
        type: file
        options:
          media: music_audio
          path: public/audio
          rename: safe
      - name: url
        label: External listening link
        type: string
      - name: draft
        label: Draft
        type: boolean
